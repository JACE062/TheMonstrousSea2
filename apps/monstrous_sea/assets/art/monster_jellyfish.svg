<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Sea Monster: Abyssal Stinging Jellyfish / Phantom Medusa -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bell / Umbrella Dome -->
    <path d="M40 95 C40 35 160 35 160 95 C145 90 135 102 120 95 C105 102 95 90 80 95 C65 102 55 90 40 95 Z" fill="#EADEC7" />
    <path d="M55 85 C65 50 135 50 145 85" stroke="#706253" stroke-width="1.8" stroke-dasharray="3,3" />
    <!-- Inner Bioluminescent Core / Organs -->
    <ellipse cx="100" cy="70" rx="25" ry="18" fill="#2A5A48" fill-opacity="0.3" stroke="#2A5A48" />
    <!-- Oral Arms (central ruffled tentacles) -->
    <path d="M85 96 C80 120 95 135 88 165" stroke="#1B1612" stroke-width="3" />
    <path d="M100 97 C105 125 95 140 102 170" stroke="#1B1612" stroke-width="3.5" />
    <path d="M115 96 C120 120 108 135 114 165" stroke="#1B1612" stroke-width="3" />
    <!-- Fine Stinging Tendrils (shock/venom) -->
    <path d="M48 95 C42 120 52 145 46 175" stroke="#6C3483" stroke-width="1.8" />
    <path d="M62 96 C56 125 68 150 60 180" stroke="#6C3483" stroke-width="1.8" />
    <path d="M74 97 C68 128 78 155 72 185" stroke="#6C3483" stroke-width="1.8" />
    <path d="M126 97 C132 128 122 155 128 185" stroke="#6C3483" stroke-width="1.8" />
    <path d="M138 96 C144 125 132 150 140 180" stroke="#6C3483" stroke-width="1.8" />
    <path d="M152 95 C158 120 148 145 154 175" stroke="#6C3483" stroke-width="1.8" />
    <!-- Small electric charge sparks -->
    <circle cx="50" cy="140" r="2" fill="#6C3483" />
    <circle cx="150" cy="145" r="2" fill="#6C3483" />
    <circle cx="102" cy="155" r="2.5" fill="#2A5A48" />
  </g>
</svg>
