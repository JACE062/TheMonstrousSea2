    <!-- Undulating Coiling Body -->
    <path d="M15 130 C25 80 50 70 70 120 C85 160 115 160 130 115 C145 70 170 80 180 125 C170 145 150 145 138 120 C125 90 98 90 82 125 C65 165 30 165 15 130 Z" fill="#D5C4A1" />
