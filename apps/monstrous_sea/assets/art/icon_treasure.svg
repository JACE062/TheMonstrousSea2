<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Vintage Spanish Treasure Chest -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chest Base -->
    <path d="M15 50 L20 85 L80 85 L85 50 Z" fill="#D5C4A1" />
    <!-- Chest Arched Lid -->
    <path d="M15 50 C15 32 85 32 85 50 Z" fill="#C4B28F" />
    <!-- Iron / Brass Straps -->
    <path d="M35 36 C35 36 35 85 35 85" stroke="#B58900" stroke-width="3" />
    <path d="M65 36 C65 36 65 85 65 85" stroke="#B58900" stroke-width="3" />
    <!-- Keyhole Clasp -->
    <rect x="44" y="46" width="12" height="15" rx="2" fill="#B58900" stroke="#1B1612" stroke-width="2" />
    <circle cx="50" cy="52" r="2" fill="#1B1612" />
    <line x1="50" y1="54" x2="50" y2="58" stroke="#1B1612" stroke-width="2" />
    <!-- Glowing Gold Doubloons Peeking Out -->
    <circle cx="28" cy="46" r="3.5" fill="#B58900" stroke="#1B1612" stroke-width="1" />
    <circle cx="72" cy="47" r="3.5" fill="#B58900" stroke="#1B1612" stroke-width="1" />
  </g>
</svg>
