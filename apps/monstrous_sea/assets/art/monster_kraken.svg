<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Boss Monster: The Colossal Kraken -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dark Abyssal Whirlpool / Foam at Base -->
    <ellipse cx="100" cy="165" rx="85" ry="25" fill="#1A2F3B" stroke="#1B1612" stroke-width="2" />
    <path d="M25 165 C35 150 165 150 175 165 C160 178 40 178 25 165" fill="#2A5A48" fill-opacity="0.3" stroke="#706253" />
    <!-- Colossal Head / Brow -->
    <path d="M60 135 C55 70 145 70 140 135 Z" fill="#D5C4A1" stroke-width="3" />
    <!-- Ancient Wrinkled Brow & Horns -->
    <path d="M75 95 Q100 85 125 95" stroke="#706253" stroke-width="2.5" />
    <path d="M78 85 Q100 75 122 85" stroke="#706253" stroke-width="2.5" />
    <!-- Menacing Glowing Eyes -->
    <circle cx="82" cy="115" r="7" fill="#8B1E1E" />
    <circle cx="82" cy="115" r="3" fill="#B58900" />
    <circle cx="83" cy="114" r="1" fill="#FDFBF7" />
    <circle cx="118" cy="115" r="7" fill="#8B1E1E" />
    <circle cx="118" cy="115" r="3" fill="#B58900" />
    <circle cx="119" cy="114" r="1" fill="#FDFBF7" />
    <!-- Central Beak / Maw -->
    <path d="M95 128 L100 138 L105 128 Z" fill="#1B1612" />
    <!-- Gargantuan Tentacles Reaching to the Sky -->
    <!-- Outer Left Tentacle -->
    <path d="M45 155 C15 130 5 80 20 50 C28 35 40 45 35 60 C25 80 35 125 55 150" fill="#C4B28F" stroke-width="3" />
    <!-- Inner Left Tentacle -->
    <path d="M65 145 C45 110 40 70 58 40 C65 28 75 35 70 50 C58 75 62 115 75 142" fill="#C4B28F" stroke-width="3" />
    <!-- Center-Left High Tentacle -->
    <path d="M85 135 C80 90 85 50 96 25 C102 15 110 20 106 35 C98 60 95 100 95 135" fill="#C4B28F" stroke-width="3" />
    <!-- Inner Right Tentacle -->
    <path d="M115 135 C120 90 115 50 104 25 C98 15 90 20 94 35 C102 60 105 100 105 135" fill="#C4B28F" stroke-width="3" />
    <!-- Center-Right Tentacle -->
    <path d="M135 145 C155 110 160 70 142 40 C135 28 125 35 130 50 C142 75 138 115 125 142" fill="#C4B28F" stroke-width="3" />
    <!-- Outer Right Tentacle -->
    <path d="M155 155 C185 130 195 80 180 50 C172 35 160 45 165 60 C175 80 165 125 145 150" fill="#C4B28F" stroke-width="3" />
    <!-- Barbed suckers -->
    <circle cx="22" cy="70" r="2.5" fill="#8B1E1E" />
    <circle cx="30" cy="95" r="2.5" fill="#8B1E1E" />
    <circle cx="58" cy="65" r="2.5" fill="#8B1E1E" />
    <circle cx="178" cy="70" r="2.5" fill="#8B1E1E" />
    <circle cx="170" cy="95" r="2.5" fill="#8B1E1E" />
    <circle cx="142" cy="65" r="2.5" fill="#8B1E1E" />
    <!-- Raging Sea Swells -->
    <path d="M5 170 Q25 158 50 168 T100 168 T150 168 T195 162" stroke="#1B1612" stroke-width="2.5" />
  </g>
</svg>
