<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Vintage Barque / Standard Ship -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hull -->
    <path d="M25 130 C45 160 155 160 175 130 L160 130 C130 142 60 142 35 130 Z" fill="#EADEC7" />
    <path d="M25 130 L10 115 L40 118 L170 118 L185 110 L175 130" fill="#D5C4A1" />
    <line x1="30" y1="124" x2="168" y2="124" stroke-dasharray="3,3" />
    <!-- Bowsprit -->
    <line x1="25" y1="120" x2="5" y2="105" stroke-width="3" />
    <!-- Masts -->
    <line x1="60" y1="120" x2="60" y2="40" stroke-width="3" />
    <line x1="110" y1="120" x2="110" y2="30" stroke-width="3.5" />
    <line x1="150" y1="120" x2="150" y2="50" stroke-width="2.5" />
    <!-- Fore Mast Sails -->
    <path d="M45 50 Q60 55 75 50 Q65 75 60 75 Q55 75 45 50 Z" fill="#FDFBF7" />
    <path d="M40 80 Q60 86 80 80 Q70 105 60 105 Q50 105 40 80 Z" fill="#FDFBF7" />
    <!-- Main Mast Sails -->
    <path d="M90 40 Q110 46 130 40 Q120 65 110 65 Q100 65 90 40 Z" fill="#FDFBF7" />
    <path d="M85 70 Q110 78 135 70 Q125 98 110 98 Q95 98 85 70 Z" fill="#FDFBF7" />
    <!-- Mizzen Sail -->
    <path d="M140 60 Q150 63 160 60 Q155 85 150 85 Q145 85 140 60 Z" fill="#FDFBF7" />
    <!-- Rigging lines -->
    <line x1="10" y1="105" x2="60" y2="40" stroke-width="1" stroke="#706253" />
    <line x1="60" y1="40" x2="110" y2="30" stroke-width="1" stroke="#706253" />
    <line x1="110" y1="30" x2="150" y2="50" stroke-width="1" stroke="#706253" />
    <line x1="150" y1="50" x2="175" y2="120" stroke-width="1" stroke="#706253" />
    <!-- Flag / Pennant -->
    <path d="M110 30 L125 33 L110 36 Z" fill="#8B1E1E" stroke="#8B1E1E" />
    <!-- Waterline ripple -->
    <path d="M15 145 Q25 140 35 145 T55 145 T75 145 T95 145 T115 145 T135 145 T155 145 T175 145 T190 145" stroke="#706253" stroke-width="1.5" />
  </g>
</svg>
