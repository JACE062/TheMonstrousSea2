<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Sea Monster: Abyssal Titan Crustacean -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spiky Armored Carapace -->
    <path d="M50 115 C40 85 70 65 100 65 C130 65 160 85 150 115 C135 135 65 135 50 115 Z" fill="#D5C4A1" />
    <!-- Carapace Spikes & Grooves -->
    <path d="M60 85 L45 72 L65 80 M100 65 L100 50 L108 66 M140 85 L155 72 L135 80" stroke="#1B1612" stroke-width="2.5" fill="#C4B28F" />
    <path d="M75 95 Q100 105 125 95" stroke="#706253" stroke-width="2" />
    <!-- Eye Stalks -->
    <line x1="88" y1="68" x2="84" y2="52" stroke-width="2.5" />
    <circle cx="84" cy="50" r="3.5" fill="#1B1612" />
    <circle cx="85" cy="49" r="1.2" fill="#B58900" />
    <line x1="112" y1="68" x2="116" y2="52" stroke-width="2.5" />
    <circle cx="116" cy="50" r="3.5" fill="#1B1612" />
    <circle cx="117" cy="49" r="1.2" fill="#B58900" />
    <!-- Massive Crushing Chelae (Claws) -->
    <!-- Left Claw -->
    <path d="M50 100 C30 90 20 110 32 120" stroke-width="3.5" />
    <path d="M25 80 C10 65 5 95 18 108 C32 122 45 100 38 88 Z" fill="#C4B28F" stroke-width="2.5" />
    <path d="M12 75 C10 60 25 65 28 80" stroke="#8B1E1E" stroke-width="2.5" />
    <!-- Right Claw -->
    <path d="M150 100 C170 90 180 110 168 120" stroke-width="3.5" />
    <path d="M175 80 C190 65 195 95 182 108 C168 122 155 100 162 88 Z" fill="#C4B28F" stroke-width="2.5" />
    <path d="M188 75 C190 60 175 65 172 80" stroke="#8B1E1E" stroke-width="2.5" />
    <!-- Walking Legs (4 pairs) -->
    <path d="M55 120 C35 130 30 150 25 165" stroke-width="2.5" />
    <path d="M68 125 C55 140 50 160 45 172" stroke-width="2.5" />
    <path d="M145 120 C165 130 170 150 175 165" stroke-width="2.5" />
    <path d="M132 125 C145 140 150 160 155 172" stroke-width="2.5" />
    <!-- Mouthparts / Mandibles -->
    <rect x="94" y="110" width="12" height="10" fill="#706253" />
    <!-- Water froth -->
    <path d="M20 148 Q40 140 60 148 T100 148 T140 148 T180 148" stroke="#706253" stroke-width="1.8" />
  </g>
</svg>
