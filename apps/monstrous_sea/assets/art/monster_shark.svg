<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Sea Monster: Horned Abyssal Shark -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body Profile -->
    <path d="M190 100 C155 70 85 75 30 92 C15 97 5 105 10 115 C20 125 45 125 70 120 C110 128 150 125 190 100 Z" fill="#D5C4A1" />
    <!-- Dorsal Fin -->
    <path d="M115 76 L130 35 C115 48 100 68 95 77 Z" fill="#C4B28F" />
    <!-- Pectoral Fin -->
    <path d="M80 122 L65 158 C78 150 92 135 98 123 Z" fill="#C4B28F" />
    <!-- Heterocercal Tail / Caudal Fin -->
    <path d="M185 100 L200 65 C185 90 180 100 185 100 L200 135 C185 120 180 105 185 100" fill="#C4B28F" />
    <!-- Jaws & Teeth -->
    <path d="M22 108 C32 115 45 116 52 110" stroke="#8B1E1E" stroke-width="2.5" />
    <!-- Teeth -->
    <path d="M25 109 L28 114 L31 109 L34 114 L37 109 L40 114 L43 109 L46 114 L49 109" stroke="#1B1612" stroke-width="1.5" fill="#FDFBF7" />
    <!-- Eye -->
    <circle cx="38" cy="95" r="3" fill="#1B1612" />
    <circle cx="39" cy="94" r="1" fill="#FDFBF7" />
    <!-- Horn / Brow Ridge -->
    <path d="M30 90 L18 80 L35 88" stroke="#1B1612" stroke-width="2.5" fill="#C4B28F" />
    <!-- Gill Slits -->
    <line x1="68" y1="95" x2="65" y2="108" stroke="#706253" stroke-width="2" />
    <line x1="73" y1="94" x2="70" y2="109" stroke="#706253" stroke-width="2" />
    <line x1="78" y1="93" x2="75" y2="110" stroke="#706253" stroke-width="2" />
    <line x1="83" y1="93" x2="80" y2="110" stroke="#706253" stroke-width="2" />
    <!-- Water churn -->
    <path d="M10 135 Q30 130 50 135 T90 135 T130 135 T170 135" stroke="#706253" stroke-width="1.8" />
  </g>
</svg>
