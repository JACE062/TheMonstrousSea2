<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Legendary Ghost Ship: The Flying Dutchman -->
  <g fill="none" stroke="#2A5A48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spectral glow / Ribbed Ghostly Hull -->
    <path d="M15 125 C35 160 160 160 180 120 L168 105 L150 115 L40 115 Z" fill="#1B1612" stroke="#2A5A48" />
    <!-- Exposed skeletal ribcage on hull -->
    <path d="M45 120 L40 148 M65 120 L62 152 M85 120 L84 153 M105 120 L106 153 M125 120 L128 150 M145 120 L150 145" stroke="#2A5A48" stroke-width="2" />
    <!-- Menacing Ram / Sea Dragon figurehead -->
    <path d="M15 125 C5 115 2 95 18 90 C12 100 20 108 28 115" stroke="#2A5A48" fill="#1B1612" stroke-width="2.5" />
    <circle cx="12" cy="96" r="2" fill="#8B1E1E" />
    <!-- Gnarly Broken Masts -->
    <line x1="60" y1="115" x2="55" y2="38" stroke-width="3" stroke="#2A5A48" />
    <line x1="110" y1="115" x2="110" y2="28" stroke-width="3.5" stroke="#2A5A48" />
    <line x1="150" y1="115" x2="155" y2="48" stroke-width="2.5" stroke="#2A5A48" />
    <!-- Tattered Spectral Shredded Sails with holes -->
    <path d="M42 48 Q58 52 72 48 Q68 70 65 72 L60 65 L55 75 Q48 70 42 48 Z" fill="#2A5A48" fill-opacity="0.3" stroke="#2A5A48" />
    <path d="M40 76 Q58 82 76 76 Q72 100 68 102 L64 95 L58 105 Q46 100 40 76 Z" fill="#2A5A48" fill-opacity="0.3" stroke="#2A5A48" />
    <path d="M90 38 Q110 44 130 38 Q125 65 120 68 L115 58 L110 68 Q98 62 90 38 Z" fill="#2A5A48" fill-opacity="0.3" stroke="#2A5A48" />
    <path d="M86 70 Q110 78 134 70 Q128 98 122 102 L116 90 L110 102 Q94 95 86 70 Z" fill="#2A5A48" fill-opacity="0.3" stroke="#2A5A48" />
    <!-- Spectral mist at waterline -->
    <path d="M5 145 Q25 138 45 145 T85 145 T125 145 T165 145 T195 140" stroke="#2A5A48" stroke-width="2" stroke-dasharray="4,4" />
  </g>
</svg>
