<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Vintage Ironclad Ram-Vessel -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Armored Low-Profile Hull -->
    <path d="M15 130 L30 115 L170 115 L185 125 L165 145 C120 155 60 155 30 145 Z" fill="#706253" />
    <!-- Heavy Ram Prow -->
    <path d="M5 135 L30 115 L28 138 Z" fill="#1B1612" />
    <line x1="5" y1="135" x2="30" y2="135" stroke-width="2.5" />
    <!-- Armor Plating Lines & Rivets -->
    <line x1="45" y1="115" x2="45" y2="148" stroke="#3D332A" stroke-width="2" />
    <line x1="85" y1="115" x2="85" y2="152" stroke="#3D332A" stroke-width="2" />
    <line x1="125" y1="115" x2="125" y2="150" stroke="#3D332A" stroke-width="2" />
    <line x1="160" y1="115" x2="160" y2="142" stroke="#3D332A" stroke-width="2" />
    <!-- Rivet dots -->
    <circle cx="45" cy="125" r="1.5" fill="#EADEC7" />
    <circle cx="85" cy="125" r="1.5" fill="#EADEC7" />
    <circle cx="125" cy="125" r="1.5" fill="#EADEC7" />
    <circle cx="160" cy="125" r="1.5" fill="#EADEC7" />
    <!-- Gun Ports -->
    <rect x="58" y="122" width="12" height="7" fill="#1B1612" />
    <rect x="98" y="122" width="12" height="7" fill="#1B1612" />
    <rect x="138" y="122" width="12" height="7" fill="#1B1612" />
    <!-- Armored Casemate / Turret -->
    <path d="M60 115 L75 95 L145 95 L160 115 Z" fill="#5A4E42" stroke-width="2.5" />
    <!-- Iron Smokestack / Steam Funnel -->
    <rect x="100" y="70" width="14" height="25" fill="#3D332A" stroke-width="2" />
    <line x1="97" y1="70" x2="117" y2="70" stroke-width="2.5" />
    <!-- Billowing Steam / Smoke -->
    <path d="M107 68 C100 55 120 45 110 35 C125 30 135 45 130 55" stroke="#706253" stroke-width="2" stroke-dasharray="3,3" />
    <!-- Sturdy Mast -->
    <line x1="50" y1="95" x2="50" y2="45" stroke-width="3" />
    <path d="M38 52 Q50 56 62 52 Q56 75 50 75 Q44 75 38 52 Z" fill="#EADEC7" />
    <!-- Waves -->
    <path d="M10 148 Q30 142 50 148 T90 148 T130 148 T170 148 T195 148" stroke="#1B1612" stroke-width="1.8" />
  </g>
</svg>
