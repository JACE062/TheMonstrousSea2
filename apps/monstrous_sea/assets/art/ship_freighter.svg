<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Vintage Heavy Freighter / Merchant Galleon -->
  <g fill="none" stroke="#1B1612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Deep Bulky Hull -->
    <path d="M20 120 C35 168 160 168 180 120 L168 110 L150 110 L140 120 L50 120 L40 112 Z" fill="#D5C4A1" />
    <path d="M30 135 L170 135 L165 155 C140 165 55 165 35 155 Z" fill="#C4B28F" />
    <!-- Cargo Hold Crates / Hatches on Deck -->
    <rect x="60" y="108" width="22" height="12" fill="#EADEC7" stroke-width="2" />
    <rect x="90" y="105" width="26" height="15" fill="#EADEC7" stroke-width="2" />
    <line x1="60" y1="108" x2="82" y2="120" stroke-width="1.2" />
    <line x1="90" y1="105" x2="116" y2="120" stroke-width="1.2" />
    <!-- High Stern Castle -->
    <path d="M145 110 L175 100 L180 120 L150 122 Z" fill="#EADEC7" />
    <rect x="155" y="105" width="8" height="6" fill="#1B1612" />
    <!-- Masts & Heavy Spars -->
    <line x1="55" y1="112" x2="55" y2="45" stroke-width="3" />
    <line x1="105" y1="105" x2="105" y2="35" stroke-width="3.5" />
    <!-- Full Billowing Sails -->
    <path d="M38 55 Q55 60 72 55 Q65 80 55 80 Q45 80 38 55 Z" fill="#FDFBF7" />
    <path d="M85 45 Q105 52 125 45 Q115 75 105 75 Q95 75 85 45 Z" fill="#FDFBF7" />
    <path d="M82 80 Q105 88 128 80 Q118 105 105 105 Q92 105 82 80 Z" fill="#FDFBF7" />
    <!-- Bowsprit -->
    <line x1="30" y1="115" x2="8" y2="98" stroke-width="3" />
    <!-- Gold / Doubloon emblem on stern -->
    <circle cx="168" cy="115" r="3.5" fill="#B58900" stroke="#1B1612" stroke-width="1" />
    <!-- Waterlines -->
    <path d="M10 148 Q25 143 40 148 T70 148 T100 148 T130 148 T160 148 T190 148" stroke="#706253" stroke-width="1.5" />
  </g>
</svg>
